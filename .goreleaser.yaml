version: 2

project_name: pandemonium

before:
  hooks:
    - go mod tidy

# GUI-only Ebiten FPS: a cgo/Metal darwin build shipped as a Homebrew cask. Built on a
# macOS runner (a Linux clang cannot cross-build a darwin cgo binary). Linux/Windows users
# build from source.
builds:
  - id: pandemonium
    main: ./cmd/pandemonium
    binary: pandemonium
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [pandemonium]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"

# Homebrew cask: the macOS-only native Ebiten window.
homebrew_casks:
  - name: pandemonium
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/danielriddell21/pandemonium
    description: A procedurally generated DOOM-style raycaster FPS
    license: MIT
    caveats: "pandemonium opens an Ebiten window and is macOS-only; on Linux/Windows, build from source."
