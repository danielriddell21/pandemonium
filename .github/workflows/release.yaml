name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: danielriddell21/github-actions/.github/workflows/release.yaml@v2
    permissions:
      contents: write
    with:
      cask-name: pandemonium
      cask-desc: A procedurally generated DOOM-style raycaster FPS
      cask-caveats: >-
        pandemonium opens an Ebiten window and is macOS-only; on Linux/Windows,
        build from source.
    secrets:
      tap-app-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
